name: Validate Load Tester Pro

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-skill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate skill metadata and agent bundles
        run: python tools/validate_skill.py

      - name: Check Python and shell syntax
        run: |
          python -m py_compile scripts/locust/locustfile.py
          python -m py_compile scripts/locust/checkout_auth_flow.py scripts/summarize_results.py
          bash -n scripts/run-k6.sh scripts/run-locust.sh

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check k6 JavaScript syntax
        run: node --input-type=module --check < scripts/k6/user-flow.js
